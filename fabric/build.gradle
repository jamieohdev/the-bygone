plugins{ alias libs.plugins.fabric.loom }
repositories{
    maven{ url = 'https://api.modrinth.com/maven' }
    maven{ url = 'https://maven.parchmentmc.org' }
}

base{ archivesName = "${project.modid}-${project.name}-${libs.versions.minecraft.get()}" }
loom{
    accessWidenerPath = file("src/main/resources/${project.modid}.classtweaker")
    mods{ "${project.modid}"{
        sourceSet sourceSets.main
    } }

    runs{
        configureEach{
            configName = "Fabric ${it.name.capitalize()} (${project.path})"
            ideConfigGenerated = true
        }
        client{ client() }
        server{ server() }
    }
}

configurations{
    dependencyScope('common')
    resolvable('commoners'){ extendsFrom(common) }
    implementation.extendsFrom(common)
}
dependencies{
    common(project(':common')){ transitive = false }

    minecraft libs.minecraft
    mappings loom.layered{
        officialMojangMappings()
        parchment variantOf(libs.parchment){ artifactType 'zip' }
    }

    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    modImplementation libs.fabric.jinxedlib
    modImplementation libs.fabric.lithostitched
    modImplementation libs.fabric.moredfs

    include libs.fabric.moredfs
}


def properties = providers.gradlePropertiesPrefixedBy('').get()
processResources{
    filesMatching(['fabric.mod.json']){
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach{
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

jar{
    dependsOn configurations.commoners
    from{ configurations.commoners.collect{ zipTree(it) } }
}
