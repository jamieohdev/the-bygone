plugins{ alias libs.fabric.loom }
repositories{ maven{ url = "https://api.modrinth.com/maven" } }

base{ archivesName = "${project.modid}-fabric" }
version = "${project.version}"
group = "${project.groupid}"

loom{
    accessWidenerPath = file("src/main/resources/${project.modid}.accesswidener")
    mods{ "${project.modid}"{
        sourceSet sourceSets.main
    } }

    runs{
        configureEach{
            configName = "Fabric ${it.name.capitalize()} (${project.path})"
            ideConfigGenerated = true
        }
        client{ client() }
        server{ server() }
    }
}

dependencies{
    project(':common')

    minecraft libs.minecraft
    mappings loom.layered{
        officialMojangMappings()
        parchment variantOf(libs.parchment){ artifactType 'zip' }
    }

    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    modImplementation libs.fabric.jinxedlib
    modImplementation libs.fabric.lithostitched
    modImplementation libs.fabric.moredfs

    include libs.fabric.moredfs
}

processResources{
    filesMatching(['fabric.mod.json']){
        expand project: project, libs: libs
    }
}
