plugins{ alias libs.plugins.neoforge.moddev }
repositories{ maven{ url = 'https://api.modrinth.com/maven' } }

neoForge{
    neoFormVersion = libs.versions.neoforge.neoform.get()
    parchment{
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    validateAccessTransformers = true
    interfaceInjectionData.from "interfaces.json"
}

dependencies{
    compileOnly libs.mixin
    compileOnly libs.mixin.extras
    compileOnly libs.neoforge.jinxedlib
}

jar{
    from(project(':').file('CREDITS').absolutePath, project(':').file('LICENSE').absolutePath)
}