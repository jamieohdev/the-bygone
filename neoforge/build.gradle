plugins{ alias libs.plugins.neoforge.moddev }
repositories{
    maven{ url = 'https://api.modrinth.com/maven' }
}

base{ archivesName = "${project.modid}-${project.name}-${libs.versions.minecraft.get()}" }
neoForge{
    version = libs.versions.neoforge.neoforge.get()
    parchment{
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    validateAccessTransformers = true
    interfaceInjectionData.from 'src/main/resources/META-INF/interfaces.json'

    mods{ "${project.modid}"{
        sourceSet sourceSets.main
        sourceSet project(':common').sourceSets.main
    } }

    runs{
        configureEach{
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client{ client() }
        server{ server() }
    }
}

configurations{
    dependencyScope('common')
    resolvable('commoners'){ extendsFrom(common) }
    implementation.extendsFrom(common)
}
dependencies{
    common(project(':common')){ transitive = false }

    implementation libs.neoforge.jinxedlib
    implementation libs.neoforge.lithostitched
    implementation libs.neoforge.moredfs

    jarJar libs.neoforge.moredfs
}

def properties = providers.gradlePropertiesPrefixedBy('').get()
processResources{
    filesMatching(['META-INF/neoforge.mods.toml']){
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach{
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

jar{
    dependsOn configurations.commoners
    from{ configurations.commoners.collect{ zipTree(it) } }
}
