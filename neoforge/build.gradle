plugins{ alias libs.neoforge.moddev }
repositories{ maven{ url = "https://api.modrinth.com/maven" } }

base{ archivesName = "${project.modid}-neoforge" }
version = "${project.version}"
group = "${project.groupid}"

neoForge{
    version = libs.versions.neoforge.neoforge.get()
    parchment{
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    validateAccessTransformers = true
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg').absolutePath)
    interfaceInjectionData.from(project(':common').file('interfaces.json').absolutePath)

    mods{ "${project.modid}"{
        sourceSet sourceSets.main
    } }

    runs{
        configureEach{
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client{ client() }
        server{ server() }
    }
}

dependencies{
    project(':common')

    implementation libs.neoforge.jinxedlib
    implementation libs.neoforge.lithostitched
    implementation libs.neoforge.moredfs

    jarJar libs.neoforge.moredfs
}

processResources{
    filesMatching(['META-INF/neoforge.mods.toml']){
        expand project: project, libs: libs
    }
}